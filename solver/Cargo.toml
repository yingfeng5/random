[package]
name = "gto_solver"
version = "0.1.0"
edition = "2021"
description = "8-max NLHE study solver: DCFR postflop (exact combos) and a precomputed 100bb preflop library"
license = "MIT"

[[bin]]
name = "export-preflop"
path = "src/bin/export_preflop.rs"

[[bin]]
name = "gto-server"
path = "src/bin/gto_server.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
